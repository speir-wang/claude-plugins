name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A merge made with GITHUB_TOKEN doesn't start a new run, so merge the
      # release PR here and run release-please again to tag it.
      - name: Merge the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ fromJSON(steps.release.outputs.pr).number }} --squash --repo ${{ github.repository }}

      - name: Tag the release
        if: steps.release.outputs.prs_created == 'true'
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
